plugins { id 'com.android.application' }
android {
    namespace 'com.diberlog.jarvis.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.diberlog.jarvis.mobile.syncv2lab'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0-sync-v2-lab'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        labRelease {
            if (System.getenv('JARVIS_LAB_KEYSTORE')) {
                storeFile file(System.getenv('JARVIS_LAB_KEYSTORE'))
                storePassword System.getenv('JARVIS_LAB_SIGNING_PASSWORD')
                keyAlias 'jarvis-sync-v2-lab'
                keyPassword System.getenv('JARVIS_LAB_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.labRelease; minifyEnabled false } }
    defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
}
dependencies {
    implementation 'androidx.fragment:fragment:1.8.6'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
