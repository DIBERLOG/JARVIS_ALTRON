plugins { id 'com.android.application' }
android {
    namespace 'com.diberlog.jarvis.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.diberlog.jarvis.mobile.syncv2lab'
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName '1.1.16'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        labRelease {
            if (System.getenv('JARVIS_LAB_KEYSTORE')) {
                storeFile file(System.getenv('JARVIS_LAB_KEYSTORE'))
                storePassword System.getenv('JARVIS_LAB_SIGNING_PASSWORD')
                keyAlias 'jarvis-sync-v2-lab'
                keyPassword System.getenv('JARVIS_LAB_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.labRelease; minifyEnabled false } }
    defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/mobile-center/assets')
}
tasks.register('buildMobileCenter', Exec) {
    workingDir file('../../../frontend')
    commandLine 'node', 'mobile/build.mjs'
    inputs.files(fileTree('../../../frontend/src/components'),fileTree('../../../frontend/src/lib'),fileTree('../../../frontend/src/css'),fileTree('../../../frontend/mobile'),file('../../../frontend/public/images/training-body-hud-v1.png'))
    outputs.dir layout.buildDirectory.dir('generated/mobile-center/assets')
}
tasks.named('preBuild').configure { dependsOn 'buildMobileCenter' }
dependencies {
    implementation 'androidx.fragment:fragment:1.8.6'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
