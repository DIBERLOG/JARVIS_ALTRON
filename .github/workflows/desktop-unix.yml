name: Linux and macOS packages (experimental)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        default: all
        options: [all, macos, linux]
  pull_request:
    paths:
      - 'crates/**'
      - 'reimplementation/**'
      - 'frontend/**'
      - 'tools/*desktop.sh'
      - 'Cargo*'
      - '.github/workflows/desktop-unix.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'macos' && '[{"os":"macos-15-intel","name":"macos-intel","vosk":"0.3.42"},{"os":"macos-15","name":"macos-apple-silicon","vosk":"0.3.42"}]' || inputs.platform == 'linux' && '[{"os":"ubuntu-24.04","name":"linux-x64","vosk":"0.3.45"}]' || '[{"os":"ubuntu-24.04","name":"linux-x64","vosk":"0.3.45"},{"os":"macos-15-intel","name":"macos-intel","vosk":"0.3.42"},{"os":"macos-15","name":"macos-apple-silicon","vosk":"0.3.42"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release/deps
            target/release/build
            target/release/.fingerprint
          key: native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'tools/package-desktop.sh') }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'tools/package-desktop.sh') }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev librsvg2-dev libasound2-dev libgtk-3-dev libayatana-appindicator3-dev patchelf espeak-ng xdg-utils libnotify-bin
      - name: Rust and Vosk (native architecture)
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          python -m pip download --no-deps --only-binary=:all: 'vosk==${{ matrix.vosk }}' -d target/vosk-wheel
          wheel=$(find target/vosk-wheel -name '*.whl' -print -quit)
          python -m zipfile -e "$wheel" target/vosk-native
          echo "VOSK_LIBRARY_DIR=$GITHUB_WORKSPACE/target/vosk-native/vosk" >> "$GITHUB_ENV"
      - name: Package
        shell: bash
        run: bash tools/package-desktop.sh
      - name: Core resource smoke test (not microphone test)
        shell: bash
        run: |
          export JARVIS_RESOURCE_ROOT="$GITHUB_WORKSPACE"
          export VOSK_LIBRARY_DIR="$GITHUB_WORKSPACE/target/release"
          export LD_LIBRARY_PATH="$VOSK_LIBRARY_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export DYLD_FALLBACK_LIBRARY_PATH="$VOSK_LIBRARY_DIR${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}"
          if [[ "$RUNNER_OS" == Linux ]]; then
            export RUSTFLAGS=" -C link-arg=-Wl,-rpath,\$ORIGIN/../lib/jarvis-altron"
          else
            export RUSTFLAGS=" -C link-arg=-Wl,-rpath,@executable_path/../Frameworks"
          fi
          if [[ "$(uname -m)" == x86_64 && "$RUNNER_OS" == macOS ]]; then
            export ORT_LIB_LOCATION="$GITHUB_WORKSPACE/target/onnxruntime/onnxruntime-osx-x86_64-1.23.2/lib"
            export ORT_PREFER_DYNAMIC_LINK=1
          fi
          target/release/jarvis-app --release-smoke-test
          cargo test --locked --release -p jarvis-core platform::tests
      - name: Packaged paths and native loader smoke test
        shell: bash
        run: |
          unset JARVIS_RESOURCE_ROOT LD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH
          if [[ "$RUNNER_OS" == Linux ]]; then
            package=$(find target/release/bundle/deb -name '*.deb' -print -quit)
            payload=$(mktemp -d)
            dpkg-deb -x "$package" "$payload"
            "$payload/usr/bin/jarvis-app" --release-smoke-test
            "$payload/usr/bin/jarvis-gui" --release-smoke-test
            image="$GITHUB_WORKSPACE/$(find target/release/bundle/appimage -name '*.AppImage' -print -quit)"
            appimage_payload=$(mktemp -d)
            (cd "$appimage_payload" && "$image" --appimage-extract >/dev/null)
            "$appimage_payload/squashfs-root/usr/bin/jarvis-app" --release-smoke-test
            "$appimage_payload/squashfs-root/usr/bin/jarvis-gui" --release-smoke-test
            sudo apt-get install -y "./$package"
            /usr/bin/jarvis-app --release-smoke-test
            /usr/bin/jarvis-gui --release-smoke-test
          else
            app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
            "$app/Contents/MacOS/jarvis-app" --release-smoke-test
            "$app/Contents/MacOS/jarvis-gui" --release-smoke-test
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-1.0.0-${{ matrix.name }}-experimental
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - uses: actions/cache/save@v4
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release/deps
            target/release/build
            target/release/.fingerprint
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
