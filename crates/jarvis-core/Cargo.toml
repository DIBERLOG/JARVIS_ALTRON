[package]
name = "jarvis-core"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
once_cell.workspace = true
log.workspace = true
rand.workspace = true
seqdiff.workspace = true
hound.workspace = true
platform-dirs.workspace = true
rodio.workspace = true
kira.workspace = true
pv_recorder.workspace = true
rustpotter.workspace = true
parking_lot.workspace = true
toml.workspace = true
sha2.workspace = true
# PNG encoding for a screenshot. The image crate is already used by the application for the
# tray icon; only the PNG codec is enabled here.
image = { version = "0.25", default-features = false, features = ["png"] }
nnnoiseless = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
fluent.workspace = true
fluent-bundle.workspace = true
unic-langid.workspace = true
chrono.workspace = true
sys-locale.workspace = true

# Local spelling: pure Rust, Hunspell-compatible dictionaries, MPL-2.0, no native
# library and no network use at runtime. See docs/AUTOCORRECT.md.
spellbook = "0.4"

# pv_recorder = { workspace = true, optional = true }
vosk = { version = "0.3.1", optional = true }
intent-classifier = { version = "0.1.0", optional = true }
# rustpotter = { workspace = true, optional = true }

tokio = { version = "1", features = ["sync"], optional = true }

mlua = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tempfile.workspace = true
zip.workspace = true

fastembed = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
uuid.workspace = true
rusqlite.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
zeroize.workspace = true
hkdf.workspace = true
sysinfo.workspace = true

[target.'cfg(windows)'.dependencies]
winrt-notification = { workspace = true, optional = true }
windows-sys.workspace = true
clipboard-win.workspace = true
# Typed Win32 and COM bindings for the safe Windows action backend: Core Audio for the
# volume, GDI for one screenshot, and the window, desktop, and session APIs. MIT OR
# Apache-2.0, no runtime and no network. See docs/WINDOWS_ACTIONS.md.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["jarvis_app"]
jarvis_app = [
    "vosk", "intent-classifier", "fastembed", "tokio", "nnnoiseless", "tokio-tungstenite", "futures-util",
    "lua",
    "ort", "ndarray", "tokenizers", "regex",]

intent = ["intent-classifier", "tokio"]
lua = ["mlua", "reqwest", "winrt-notification"]
lua_only = ["lua", "tokio"]
