# Windows, screenshots and the workstation, through what this build already does.
#
# Commands that have a typed native action use it: a screenshot goes through the
# action pipeline (including the sensitive-window refusal), locking the workstation
# uses the documented API, and the task manager is started only from the user's own
# allowlist, by role and never by path.
#
# The commands that have no native equivalent keep the AutoHotkey executor they
# always had. Those `.exe` files are produced from the `.ahk` sources next to them
# and are not part of the repository, so the catalogue reports them honestly as
# `executor_missing` instead of pretending they work.

[[commands]]
id = "windows_screenshot"
type = "native"
description = "Делает снимок экрана"
risk_level = "safe"

[commands.native]
action = "take_screenshot"

[commands.sounds]
ru = ["ok1", "ok2", "ok3"]
en = ["ok1", "ok2", "ok3"]
ua = ["ok1", "ok2", "ok3"]

[commands.phrases]
ru = ["сделай скриншот", "сделай снимок экрана", "сними экран", "скриншот"]
en = ["take a screenshot", "screenshot", "capture the screen"]
ua = ["зроби скріншот", "зроби знімок екрана", "зніми екран"]

[[commands]]
id = "windows_lock"
type = "native"
description = "Блокирует рабочую станцию"
risk_level = "safe"

[commands.native]
action = "lock_workstation"

[commands.sounds]
