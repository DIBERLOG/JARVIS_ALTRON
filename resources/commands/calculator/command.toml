# Calculator.
#
# Starting it goes through the allowlist: the pack asks for the role "calculator",
# and the host starts the file the *user* allowed — never a path from this
# document. Without such an entry the command is reported as needing configuration
# instead of failing silently.
#
# Closing it asks first, and then posts the same graceful close the interface's own
# window list posts: the window is asked to close and the application decides. The
# forced `taskkill /f /im` the old pack carried is gone — a phrase must not kill a
# process — and the window has to exist and belong to the calculator's process for
# anything to happen at all.

[[commands]]
id = "calculator_open"
type = "native"
description = "Запускает калькулятор из списка разрешённых приложений"
risk_level = "safe"

[commands.native]
action = "launch_application"
role = "calculator"

[commands.sounds]
ru = ["ok1", "ok2", "ok3"]
en = ["ok1", "ok2", "ok3"]
ua = ["ok1", "ok2", "ok3"]

[commands.phrases]
ru = ["включи калькулятор", "открой калькулятор", "покажи калькулятор", "запусти калькулятор", "калькулятор"]
en = ["open the calculator", "start the calculator", "calculator"]
ua = ["відкрий калькулятор", "запусти калькулятор", "покажи калькулятор", "калькулятор"]

[[commands]]
id = "calculator_close"
type = "native"
description = "Закрывает окно калькулятора вежливо, после подтверждения"
risk_level = "confirmation_required"

[commands.native]
action = "close_application_windows"
role = "calculator"

[commands.sounds]
ru = ["ok1", "ok2", "ok3"]
en = ["ok1", "ok2", "ok3"]
ua = ["ok1", "ok2", "ok3"]

[commands.phrases]
ru = ["закрой калькулятор", "отключи калькулятор", "выключи калькулятор", "убери калькулятор"]
en = ["close the calculator", "shut the calculator down"]
ua = ["закрий калькулятор", "вимкни калькулятор"]
