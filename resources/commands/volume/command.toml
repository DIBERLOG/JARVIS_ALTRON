ua = ["ok1", "ok2", "ok3", "ok4"]

[commands.phrases]
ru = ["звук пятьдесят", "громкость пятьдесят", "поставь звук на пятьдесят", "поставь громкость на пятьдесят", "громкость на середину", "средний уровень громкости", "поставь звук на середину"]
